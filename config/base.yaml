# Base configuration — Workshop 1. Sections marked EMPIRICAL, CALIBRATED or DESIGNED state the provenance of their values.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  results: results

data:                                   # EMPIRICAL (public data)
  price_year: 2025
  hub: HB_WEST
  window_start: "2025-03-01"
  window_end: "2025-04-30"
  tz: US/Central
  # Base site: Anchor Wind (real wind + co-located BESS plant, 5 wind units + ANCHOR_BESS1/2 share one POI)
  primary_agents: [ANCHOR_WIND1, ANCHOR_WIND2, ANCHOR_WIND3, ANCHOR_WIND4, ANCHOR_WIND5]
  # Observed co-located storage (ERCOT COP snapshot 2025-04-15: HSL = power, Maximum SOC = energy):
  #   ANCHOR 71.5 MW / 113.0 MWh vs 245.1 MW wind; VORTEX 121.8 MW / 184.0 MWh vs 331.3 MW wind; HHGT none.
  pool:
    - [HHGT_HHOLLOW1, HHGT_HHOLLOW2, HHGT_HHOLLOW3, HHGT_HHOLLOW4, HHGT_CALLAHAN]
    - [CAPRIDGE_CR1, CAPRIDGE_CR2, CAPRIDGE_CR3]
    - [ANCHOR_WIND1, ANCHOR_WIND2, ANCHOR_WIND3, ANCHOR_WIND4, ANCHOR_WIND5]
    - [VERAWIND_UNIT1, VERAWIND_UNIT2, VERAWIND_UNIT3, VERAWIND_UNIT4, VERAWIND_UNIT5]
    - [WHMESA_UNIT1, WHMESA_UNIT2_23, WHMESA_UNIT2_28, WHMESA_UNIT3_23, WHMESA_UNIT3_28]
    - [VORTEX_WIND1, VORTEX_WIND2, VORTEX_WIND3, VORTEX_WIND4]
    - [LACY_CRK_UNIT1, LACY_CRK_UNIT2, LACY_CRK_UNIT3, LACY_CRK_UNIT4]
    - [CANYONWD_UNIT1, CANYONWD_UNIT2, CANYONWD_UNIT3, CANYONWD_UNIT4, CANYONWD_UNIT5, CANYONWD_UNIT6]
  nameplate_quantile: 0.995
  eia860_url: https://www.eia.gov/electricity/data/eia860/archive/xls/eia8602023.zip

battery:                                # CALIBRATED from the observed Anchor Wind BESS (71.5 MW / 113 MWh vs 245 MW wind); efficiency from NREL ATB 2024
  p_ratio: 0.29                         # P_i = p_ratio * nameplate_i   (Anchor: 71.5/245.1 = 0.29; Vortex: 0.37; EIA-860 2023 TX hybrids p50 = 0.08)
  duration_h: 1.5                       # E_i = duration_h * P_i         (Anchor: 113/71.5 = 1.58 h; Vortex: 1.51 h; EIA-860 2023 TX BESS p50 = 1.0 h)
  eta_c: 0.922                          # sqrt(0.85) round-trip
  eta_d: 0.922
  c_deg_usd_per_mwh: 10.0               # cycling/degradation cost per MWh discharged
  eps_tiebreak_usd_per_mwh: 1.0e-3      # tiny LP tie-break cost on c + d + r ($/MWh)
  soc_init_frac: 0.5
  terminal_soc: return                  # return | free
  allow_grid_charging: true

poi:                                    # DESIGNED wargame variables
  kappa_K: 0.6                          # designed stress level at which the POI binds in ~49% of hours for the Anchor set (LBNL median wind+storage = 142% of POI is context only)
  delta_D: 0.5                          # D_t = delta_D * sum_i b_it
  lambda_minus: 250.0                   # $/MWh under-delivery penalty
  lambda_plus: 100.0                    # $/MWh attempted POI overflow penalty (strategic layer)

episode:
  horizon_h: 24

design_matrix:                          # full factorial
  cells: all                            # "all" or an explicit list of cell ids
  day_stride: 1
  price_coordination:
    proximal_tau: 2.0                   # numerical QP regularizer, $/MWh per MW; grid-selected
    step_usd_per_mwh_per_mw: 0.2        # constant rho; selected by 3-day grid
    step_decay: none                    # none | sqrt
    max_iterations: 60
    overflow_tol_rel: 1.0e-3            # x sum(N) MW
    cs_tol_usd: 1.0                     # complementary-slackness tolerance, $/hour
    warm_start: true
  game_warm_start: true

game:
  max_sweeps: 200
  tol_rel: 1.0e-5                       # undamped best-response residual max|BR_q - q| / sum(N)
  max_gain_tol: 1.0                     # $ ; converged also requires max unilateral-deviation gain <= this
  damping: 0.5
  deviation_check: true
  injection_shortfall: own              # own | phi ; INJ agents pay their own private deficit by default

monitor:
  thresholds_sigma: [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
  thresholds_frac: [0.02, 0.05, 0.10, 0.15]
  withholding_grid_frac: [0.02, 0.05, 0.10, 0.20]
  delta: 0.98
  delay_grid: [1, 4, 12]
  fine_cap_multiple_of_gain: 3.0
  ell_fraction_of_gain: 0.25
  enforceability_a: 2.0

seed: 6974
